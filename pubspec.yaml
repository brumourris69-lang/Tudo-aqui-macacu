name: tudo_aqui_macacu
description: Plataforma local de comércios, serviços e oportunidades de Cachoeiras de Macacu.
publish_to: none
version: 0.1.3+4

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.2
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  firebase_app_check: 0.3.2+10
  cloud_firestore: ^5.6.12
  firebase_messaging: ^15.2.10
  cloud_functions: 5.6.2
  google_sign_in: ^6.3.0
  google_fonts: ^6.2.1
  image_picker: 1.2.3
  http: ^1.6.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - path: assets/fonts/local-poppins/
      flavors:
        - searchLocal
    - assets/images/home-offer-cover.png
    - assets/images/utilities-main-cover.png
    - assets/images/utility-water-energy-cover.png
    - assets/images/utility-prefeitura-cover.png
    - assets/images/home-ad-anuncie-aqui.png
    - assets/images/home-tourism-cachoeiras.png
    - assets/images/home-tourism-trilhas.png
    - assets/images/home-tourism-pontos_turisticos.png
    - assets/images/home-tourism-roteiros.png
    - assets/images/category-icons-3d.png
    - assets/images/icons/
    - assets/images/home-bg-waterfall-brand.png
    - assets/images/login-success-tudo-aqui-macacu.png
    - assets/images/macacu-waterfall-hero.png
    - assets/images/splash-tudo-aqui-macacu.png
    - assets/images/tourism-bg-cachoeiras.png
    - assets/images/tourism-bg-pontos-turisticos.png
    - assets/images/tourism-bg-roteiros.png
    - assets/images/tourism-bg-trilhas.png
    - assets/images/tudo-aqui-macacu-icon-v1.png

