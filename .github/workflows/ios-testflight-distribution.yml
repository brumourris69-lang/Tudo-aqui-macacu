name: iOS Beta — arquivo e TestFlight (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_macos_usage:
        description: Verifiquei a cota e o custo do runner macOS desta execução
        type: boolean
        required: true
        default: false
      confirm_signed_archive:
        description: Autorizo gerar um arquivo iOS assinado com as credenciais protegidas
        type: boolean
        required: true
        default: false
      confirm_external_configuration:
        description: Confirmei Bundle ID, Firebase Beta, Google, Apple Sign-In e App Check
        type: boolean
        required: true
        default: false
      upload_to_testflight:
        description: Enviar o IPA ao App Store Connect para processamento do TestFlight
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ios-testflight-distribution
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Ler somente a configuração da revisão selecionada
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Bloquear antes de reservar macOS se algo não estiver pronto
        id: check
        shell: bash
        env:
          REF_NAME: ${{ github.ref }}
          CONFIRM_MACOS_USAGE: ${{ inputs.confirm_macos_usage }}
          CONFIRM_SIGNED_ARCHIVE: ${{ inputs.confirm_signed_archive }}
          CONFIRM_EXTERNAL_CONFIGURATION: ${{ inputs.confirm_external_configuration }}
          TESTFLIGHT_ENABLED: ${{ vars.IOS_TESTFLIGHT_ENABLED }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_FIREBASE_APP_ID: ${{ vars.BETA_IOS_FIREBASE_APP_ID }}
          IOS_MESSAGING_SENDER_ID: ${{ vars.BETA_IOS_MESSAGING_SENDER_ID }}
          IOS_GOOGLE_CLIENT_ID: ${{ vars.BETA_IOS_GOOGLE_CLIENT_ID }}
          IOS_GOOGLE_WEB_CLIENT_ID: ${{ vars.BETA_IOS_GOOGLE_WEB_CLIENT_ID }}
          IOS_APPLE_SIGN_IN_ENABLED: ${{ vars.BETA_IOS_APPLE_SIGN_IN_ENABLED }}
        run: |
          set -euo pipefail
          [[ "$REF_NAME" == "refs/heads/codex/mvp-1.0-git-organizacao" ]] || {
            echo "::error::Este fluxo só aceita a branch de trabalho aprovada."
            exit 1
          }
          [[ "$CONFIRM_MACOS_USAGE" == "true" && "$CONFIRM_SIGNED_ARCHIVE" == "true" && "$CONFIRM_EXTERNAL_CONFIGURATION" == "true" ]] || {
            echo "::error::Confirme custo, assinatura e configuração real antes de reservar o runner macOS."
            exit 1
          }
          [[ "$TESTFLIGHT_ENABLED" == "true" ]] || {
            echo "::error::IOS_TESTFLIGHT_ENABLED não foi habilitado após a preparação externa."
            exit 1
          }
          [[ "$IOS_BUNDLE_ID" =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]] || {
            echo "::error::IOS_BUNDLE_ID está ausente ou inválido."
            exit 1
          }
          [[ "$IOS_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || {
            echo "::error::IOS_TEAM_ID está ausente ou inválido."
            exit 1
          }
          [[ "$IOS_FIREBASE_APP_ID" =~ ^1:[0-9]+:ios:[A-Fa-f0-9]+$ ]] || {
            echo "::error::BETA_IOS_FIREBASE_APP_ID está ausente ou inválido."
            exit 1
          }
          [[ "$IOS_MESSAGING_SENDER_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::BETA_IOS_MESSAGING_SENDER_ID está ausente ou inválido."
            exit 1
          }
          for client_id in "$IOS_GOOGLE_CLIENT_ID" "$IOS_GOOGLE_WEB_CLIENT_ID"; do
            [[ "$client_id" =~ ^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$ ]] || {
              echo "::error::IDs OAuth Beta do Google ausentes ou inválidos."
              exit 1
            }
          done
          [[ "$IOS_APPLE_SIGN_IN_ENABLED" == "true" ]] || {
            echo "::error::Sign in with Apple ainda não foi habilitado após configurar e validar o provedor Beta."
            exit 1
          }
          mapfile -t bundle_ids < <(sed -nE 's/^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER = ([^;]+);/\1/p' ios/Runner.xcodeproj/project.pbxproj | grep -v '\.RunnerTests$' | sort -u)
          [[ "${#bundle_ids[@]}" -eq 1 && "${bundle_ids[0]}" == "$IOS_BUNDLE_ID" ]] || {
            echo "::error::IOS_BUNDLE_ID não corresponde ao identificador do alvo Runner."
            exit 1
          }
          grep -q 'CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;' ios/Runner.xcodeproj/project.pbxproj || {
            echo "::error::O alvo iOS não declara o arquivo de permissões de assinatura."
            exit 1
          }
          grep -q 'com.apple.developer.applesignin' ios/Runner/Runner.entitlements
          grep -q 'com.apple.developer.devicecheck.appattest-environment' ios/Runner/Runner.entitlements
          echo "ready=true" >> "$GITHUB_OUTPUT"

  ios-testflight:
    needs: preflight
    if: ${{ needs.preflight.outputs.ready == 'true' && github.ref == 'refs/heads/codex/mvp-1.0-git-organizacao' }}
    runs-on: macos-26
    environment:
      name: ios-testflight
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      FLUTTER_VERSION: '3.47.3'
      FLUTTER_REVISION: e8113bf45620cbeb8aff64947ee4c93e16adb4cf
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      CI: 'true'
      BETA_FIREBASE_PROJECT_ID: macacu-beta-261030-cf4a81
      BETA_IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      BETA_IOS_FIREBASE_APP_ID: ${{ vars.BETA_IOS_FIREBASE_APP_ID }}
      BETA_IOS_MESSAGING_SENDER_ID: ${{ vars.BETA_IOS_MESSAGING_SENDER_ID }}
      BETA_IOS_GOOGLE_CLIENT_ID: ${{ vars.BETA_IOS_GOOGLE_CLIENT_ID }}
      BETA_IOS_GOOGLE_WEB_CLIENT_ID: ${{ vars.BETA_IOS_GOOGLE_WEB_CLIENT_ID }}
      BETA_IOS_APPLE_SIGN_IN_ENABLED: ${{ vars.BETA_IOS_APPLE_SIGN_IN_ENABLED }}
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
    steps:
      - name: Verificar credenciais protegidas sem exibi-las
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          IOS_BETA_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_BETA_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_P8 }}
        run: |
          set -euo pipefail
          for name in IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_APP_STORE_PROFILE_BASE64 IOS_BETA_GOOGLE_SERVICE_INFO_PLIST_BASE64; do
            [[ -n "${!name:-}" ]] || {
              echo "::error::Falta configuração protegida necessária à assinatura ou ao Firebase Beta iOS."
              exit 1
            }
          done
          if [[ "$UPLOAD_TO_TESTFLIGHT" == "true" ]]; then
            [[ -n "$APP_STORE_CONNECT_API_KEY_ID" && -n "$APP_STORE_CONNECT_API_ISSUER_ID" && -n "$APP_STORE_CONNECT_API_PRIVATE_KEY_P8" ]] || {
              echo "::error::O envio foi solicitado, mas a chave protegida do App Store Connect está incompleta."
              exit 1
            }
          fi

      - name: Baixar código da revisão selecionada
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Confirmar Xcode e ausência de configuração Firebase versionada
        shell: bash
        run: |
          set -euo pipefail
          test -f ios/Runner.xcodeproj/project.pbxproj
          if find ios -iname 'GoogleService-Info*.plist' -print -quit | grep -q .; then
            echo "::error::Há um GoogleService-Info.plist no checkout. A configuração deve vir do segredo protegido do ambiente."
            exit 1
          fi
          plutil -lint ios/Runner.xcodeproj/project.pbxproj ios/Runner/Info.plist ios/Runner/Runner.entitlements
          xcodebuild -version

      - name: Preparar configuração Firebase Beta iOS temporária
        shell: bash
        env:
          IOS_BETA_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_BETA_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$IOS_BETA_GOOGLE_SERVICE_INFO_PLIST_BASE64" | /usr/bin/base64 -D > ios/Runner/GoogleService-Info.plist
          plutil -lint ios/Runner/GoogleService-Info.plist
          python3 - <<'PY'
          import os, plistlib, re, sys
          from pathlib import Path

          config_path = Path('ios/Runner/GoogleService-Info.plist')
          info_path = Path('ios/Runner/Info.plist')
          config = plistlib.loads(config_path.read_bytes())
          expected = {
              'PROJECT_ID': os.environ['BETA_FIREBASE_PROJECT_ID'],
              'BUNDLE_ID': os.environ['BETA_IOS_BUNDLE_ID'],
              'GOOGLE_APP_ID': os.environ['BETA_IOS_FIREBASE_APP_ID'],
              'GCM_SENDER_ID': os.environ['BETA_IOS_MESSAGING_SENDER_ID'],
              'CLIENT_ID': os.environ['BETA_IOS_GOOGLE_CLIENT_ID'],
          }
          if expected['PROJECT_ID'] != 'macacu-beta-261030-cf4a81':
              sys.exit('Bloqueado: o projeto não é o Beta permitido.')
          if any(config.get(key) != value for key, value in expected.items()):
              sys.exit('Bloqueado: GoogleService-Info.plist diverge do Bundle ID ou da identidade Beta aprovada.')
          reversed_client_id = config.get('REVERSED_CLIENT_ID', '')
          if not re.fullmatch(r'com\.googleusercontent\.apps\.[A-Za-z0-9_-]+', reversed_client_id):
              sys.exit('Bloqueado: REVERSED_CLIENT_ID ausente ou inválido.')
          info = plistlib.loads(info_path.read_bytes())
          url_types = info.setdefault('CFBundleURLTypes', [])
          matches = [entry for entry in url_types if reversed_client_id in entry.get('CFBundleURLSchemes', [])]
          if len(matches) > 1:
              sys.exit('Bloqueado: esquema OAuth duplicado no Info.plist.')
          if not matches:
              url_types.append({'CFBundleURLName': 'Google OAuth', 'CFBundleURLSchemes': [reversed_client_id]})
              info_path.write_bytes(plistlib.dumps(info, fmt=plistlib.FMT_XML, sort_keys=False))
          print('Configuração Firebase Beta iOS e callback OAuth validados; conteúdo omitido.')
          PY

      - name: Importar certificado e perfil de distribuição em ambiente temporário
        id: signing
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          cert_path="$RUNNER_TEMP/ios-distribution.p12"
          profile_path="$RUNNER_TEMP/ios-app-store.mobileprovision"
          decoded_profile="$RUNNER_TEMP/ios-profile.plist"
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | /usr/bin/base64 -D > "$cert_path"
          printf '%s' "$IOS_APP_STORE_PROFILE_BASE64" | /usr/bin/base64 -D > "$profile_path"
          security cms -D -i "$profile_path" > "$decoded_profile"
          profile_values="$(python3 - "$decoded_profile" "$IOS_TEAM_ID" "$BETA_IOS_BUNDLE_ID" <<'PY'
          import datetime, plistlib, re, sys
          from pathlib import Path
          profile = plistlib.loads(Path(sys.argv[1]).read_bytes())
          team, bundle = sys.argv[2:]
          ent = profile.get('Entitlements', {})
          app_id = ent.get('application-identifier', '')
          app_prefixes = profile.get('ApplicationIdentifierPrefix', [])
          apple = ent.get('com.apple.developer.applesignin', [])
          attest = ent.get('com.apple.developer.devicecheck.appattest-environment')
          expires = profile.get('ExpirationDate')
          valid = (
              profile.get('TeamIdentifier') == [team]
              and any(app_id == f'{prefix}.{bundle}' for prefix in app_prefixes)
              and 'Default' in apple
              and attest == 'production'
              and ent.get('get-task-allow') is False
              and isinstance(expires, datetime.datetime)
              and expires.replace(tzinfo=expires.tzinfo or datetime.timezone.utc) > datetime.datetime.now(datetime.timezone.utc)
              and re.fullmatch(r'[A-Za-z0-9 _.-]{1,120}', profile.get('Name', '')) is not None
          )
          if not valid:
              sys.exit('Bloqueado: perfil não confere com Team, Bundle ID, Apple Sign-In, App Attest ou validade.')
          print(profile['UUID'] + '\t' + profile['Name'])
          PY
          )"
          profile_uuid="${profile_values%%$'\t'*}"
          profile_name="${profile_values#*$'\t'}"
          [[ "$profile_uuid" =~ ^[A-Fa-f0-9-]{32,36}$ && -n "$profile_name" ]] || {
            echo "::error::Não foi possível validar o perfil App Store."
            exit 1
          }
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_dir"
          cp "$profile_path" "$profile_dir/$profile_uuid.mobileprovision"
          printf 'IOS_PROFILE_UUID=%s\nIOS_PROFILE_NAME=%s\n' "$profile_uuid" "$profile_name" >> "$GITHUB_ENV"

          keychain="$RUNNER_TEMP/ios-testflight.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf 'IOS_TEMP_KEYCHAIN=%s\nIOS_TEMP_KEYCHAIN_PASSWORD=%s\n' "$keychain" "$keychain_password" >> "$GITHUB_ENV"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert_path" -k "$keychain" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"

      - name: Preparar assinatura manual e opções de exportação
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib, re, sys
          from pathlib import Path
          project = Path('ios/Runner.xcodeproj/project.pbxproj')
          source = project.read_text()
          bundle = os.environ['BETA_IOS_BUNDLE_ID']
          team = os.environ['IOS_TEAM_ID']
          profile_uuid = os.environ['IOS_PROFILE_UUID']
          profile_name = os.environ['IOS_PROFILE_NAME']
          if not re.fullmatch(r'[A-Za-z0-9 _.-]{1,120}', profile_name):
              sys.exit('Nome do perfil contém caracteres não aceitos.')
          needle = f'PRODUCT_BUNDLE_IDENTIFIER = {bundle};'
          if source.count(needle) != 3:
              sys.exit('O alvo Runner mudou; assinatura não será aplicada automaticamente.')
          replacement = needle + '\n\t\t\t\tCODE_SIGN_STYLE = Manual;'
          replacement += f'\n\t\t\t\tDEVELOPMENT_TEAM = {team};'
          replacement += f'\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = {profile_uuid};'
          replacement += '\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";'
          project.write_text(source.replace(needle, replacement))
          options = {
              'method': 'app-store-connect',
              'destination': 'export',
              'signingStyle': 'manual',
              'teamID': team,
              'signingCertificate': 'Apple Distribution',
              'provisioningProfiles': {bundle: profile_name},
              'manageAppVersionAndBuildNumber': False,
              'uploadSymbols': True,
              'stripSwiftSymbols': True,
          }
          Path(os.environ['RUNNER_TEMP'], 'ExportOptions.plist').write_bytes(
              plistlib.dumps(options, fmt=plistlib.FMT_XML, sort_keys=False)
          )
          PY
          plutil -lint ios/Runner.xcodeproj/project.pbxproj "$RUNNER_TEMP/ExportOptions.plist"

      - name: Preparar Flutter fixado e resolver lockfile
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/flutter"
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$sdk"
          test "$(git -C "$sdk" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          export PATH="$sdk/bin:$PATH"
          flutter --version
          flutter pub get --enforce-lockfile

      - name: Arquivar e exportar IPA Beta assinado
        shell: bash
        run: |
          set -euo pipefail
          flutter build ipa --release --no-pub \
            --build-number="$GITHUB_RUN_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            --dart-define=BETA_IOS_ENABLED=true \
            --dart-define=BETA_FIREBASE_ENABLED=true \
            --dart-define=BETA_APP_CHECK_ENABLED=true \
            --dart-define=BETA_FIREBASE_PROJECT_ID=macacu-beta-261030-cf4a81 \
            --dart-define=BETA_IOS_FIREBASE_PROJECT_ID=macacu-beta-261030-cf4a81 \
            --dart-define=BETA_IOS_BUNDLE_ID="$BETA_IOS_BUNDLE_ID" \
            --dart-define=BETA_IOS_FIREBASE_APP_ID="$BETA_IOS_FIREBASE_APP_ID" \
            --dart-define=BETA_IOS_MESSAGING_SENDER_ID="$BETA_IOS_MESSAGING_SENDER_ID" \
            --dart-define=BETA_IOS_GOOGLE_CLIENT_ID="$BETA_IOS_GOOGLE_CLIENT_ID" \
            --dart-define=BETA_IOS_GOOGLE_WEB_CLIENT_ID="$BETA_IOS_GOOGLE_WEB_CLIENT_ID" \
            --dart-define=BETA_IOS_APPLE_SIGN_IN_ENABLED="$BETA_IOS_APPLE_SIGN_IN_ENABLED"

      - name: Validar IPA e identidade assinada
        id: ipa
        shell: bash
        run: |
          set -euo pipefail
          ipa="$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$ipa" && test -f "$ipa"
          mkdir -p "$RUNNER_TEMP/ipa-check"
          ditto -x -k "$ipa" "$RUNNER_TEMP/ipa-check"
          app="$RUNNER_TEMP/ipa-check/Payload/Runner.app"
          test -d "$app"
          actual_bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          [[ "$actual_bundle" == "$BETA_IOS_BUNDLE_ID" ]]
          test -f "$app/GoogleService-Info.plist"
          codesign --verify --deep --strict "$app"
          echo "ipa=$ipa" >> "$GITHUB_OUTPUT"

      - name: Enviar IPA ao App Store Connect para TestFlight
        if: ${{ inputs.upload_to_testflight }}
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_P8 }}
          IPA_PATH: ${{ steps.ipa.outputs.ipa }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$APP_STORE_CONNECT_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$APP_STORE_CONNECT_API_ISSUER_ID" =~ ^[A-Fa-f0-9-]{36}$ ]]
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          key_path="$key_dir/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY_P8" > "$key_path"
          grep -q '^-----BEGIN PRIVATE KEY-----' "$key_path"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Remover configuração e material temporário do runner
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          rm -f ios/Runner/GoogleService-Info.plist "$RUNNER_TEMP/ios-distribution.p12" \
            "$RUNNER_TEMP/ios-app-store.mobileprovision" "$RUNNER_TEMP/ios-profile.plist" \
            "$RUNNER_TEMP/ExportOptions.plist" "$HOME/.appstoreconnect/private_keys/AuthKey_"*.p8
          if [[ -n "${IOS_TEMP_KEYCHAIN:-}" ]]; then
            security delete-keychain "$IOS_TEMP_KEYCHAIN" >/dev/null 2>&1
          fi
          if [[ -n "${IOS_PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi
