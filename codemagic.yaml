workflows:
  ios-preview:
    name: Tudo Aqui Macacu — verificação para iPhone
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Preparar o projeto para iPhone
        script: |
          flutter create --platforms=ios --org br.com.tudoaquimacacu .
          rm -f test/widget_test.dart
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Tudo Aqui Macacu" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string Selecione uma foto para editar as imagens do Tudo Aqui Macacu." ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription Selecione uma foto para editar as imagens do Tudo Aqui Macacu." ios/Runner/Info.plist
      - name: Baixar dependências
        script: flutter pub get
      - name: Aplicar ícone do Tudo Aqui Macacu
        script: dart run flutter_launcher_icons -f flutter_launcher_icons_ios.yaml
      - name: Compilar versão de verificação para iPhone
        script: flutter build ios --debug --no-codesign --dart-define="IMAGE_UPLOAD_WORKER_URL=${IMAGE_UPLOAD_WORKER_URL:-https://tudo-aqui-macacu-image-upload.tudo-aqui-macacu-image-upload.workers.dev/v1/home-logo}"
    artifacts:
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log

  ios-simulator:
    name: Tudo Aqui Macacu — simulador de iPhone
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Preparar o projeto para iPhone
        script: |
          flutter create --platforms=ios --org br.com.tudoaquimacacu .
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Tudo Aqui Macacu" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string Selecione uma foto para editar as imagens do Tudo Aqui Macacu." ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription Selecione uma foto para editar as imagens do Tudo Aqui Macacu." ios/Runner/Info.plist
      - name: Baixar dependências
        script: flutter pub get
      - name: Aplicar ícone do Tudo Aqui Macacu
        script: dart run flutter_launcher_icons -f flutter_launcher_icons_ios.yaml
      - name: Compilar para o simulador de iPhone
        script: flutter build ios --simulator --debug --dart-define="IMAGE_UPLOAD_WORKER_URL=${IMAGE_UPLOAD_WORKER_URL:-https://tudo-aqui-macacu-image-upload.tudo-aqui-macacu-image-upload.workers.dev/v1/home-logo}"
    artifacts:
      - build/ios/iphonesimulator/Runner.app
      - /tmp/xcodebuild_logs/*.log


  android-debug-apk:
    name: Tudo Aqui Macacu — APK normal debug para testes
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Validar identidade Android/Firebase oficial
        script: |
          set -euo pipefail
          cp firebase/android/google-services.json android/app/google-services.json
          python3 scripts/android_release.py --static
      - name: Restaurar dependências travadas
        script: flutter pub get --enforce-lockfile
      - name: Aplicar ícone do Tudo Aqui Macacu
        script: dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml
      - name: Validar código
        script: |
          dart format --output=none lib test
          flutter analyze --no-pub
      - name: Executar testes comuns
        script: flutter test --no-pub --exclude-tags search-local
      - name: Gerar APK debug normal (sem assinatura de loja)
        script: |
          flutter build apk --debug --no-pub \
            --dart-define="IMAGE_UPLOAD_WORKER_URL=${IMAGE_UPLOAD_WORKER_URL:-https://tudo-aqui-macacu-image-upload.tudo-aqui-macacu-image-upload.workers.dev/v1/home-logo}"
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  android-beta-apk:
    name: Tudo Aqui Macacu — APK Beta debug
    max_build_duration: 30
    environment:
      flutter: stable
      groups:
        - beta-firebase-client
      vars:
        BETA_FIREBASE_PROJECT_ID: macacu-beta-261030-cf4a81
    scripts:
      - name: Validar e preparar a configuração Firebase Beta
        script: |
          set -euo pipefail
          test "$BETA_FIREBASE_PROJECT_ID" = "macacu-beta-261030-cf4a81"
          test -n "${BETA_GOOGLE_SERVICES_JSON_BASE64:-}"
          mkdir -p android/app/src/beta
          printf '%s' "$BETA_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/src/beta/google-services.json
          python3 -c 'import json,sys; c=json.load(open("android/app/src/beta/google-services.json")); p=c.get("project_info",{}).get("project_id"); a=[x.get("client_info",{}).get("android_client_info",{}).get("package_name") for x in c.get("client",[])]; sys.exit(0 if p=="macacu-beta-261030-cf4a81" and "br.com.tudoaquimacacu.tudo_aqui_macacu.beta" in a else 1)'
      - name: Baixar dependências
        script: flutter pub get
      - name: Gerar APK conectado exclusivamente ao Firebase Beta
        script: |
          flutter build apk --debug --flavor beta --no-pub \
            --dart-define=BETA_FIREBASE_ENABLED=true \
            --dart-define=BETA_APP_CHECK_ENABLED=true \
            --dart-define=BETA_FIREBASE_PROJECT_ID=macacu-beta-261030-cf4a81
    artifacts:
      - build/app/outputs/flutter-apk/app-beta-debug.apk
