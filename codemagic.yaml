workflows:
  ios-preview:
    name: Tudo Aqui Macacu — verificação para iPhone
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Preparar o projeto para iPhone
        script: |
          flutter create --platforms=ios --org br.com.tudoaquimacacu .
          rm -f test/widget_test.dart
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Tudo Aqui Macacu" ios/Runner/Info.plist
      - name: Baixar dependências
        script: flutter pub get
      - name: Compilar versão de verificação para iPhone
        script: flutter build ios --debug --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log

  ios-simulator:
    name: Tudo Aqui Macacu — simulador de iPhone
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Preparar o projeto para iPhone
        script: |
          flutter create --platforms=ios --org br.com.tudoaquimacacu .
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Tudo Aqui Macacu" ios/Runner/Info.plist
      - name: Baixar dependências
        script: flutter pub get
      - name: Compilar para o simulador de iPhone
        script: flutter build ios --simulator --debug
    artifacts:
      - build/ios/iphonesimulator/Runner.app
      - /tmp/xcodebuild_logs/*.log


  android-apk:
    name: Tudo Aqui Macacu — APK para Android
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Preparar o projeto para Android
        script: |
          flutter create --platforms=android --org br.com.tudoaquimacacu .
          cp firebase/android/google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path

          def insert_after(path, needle, addition):
              file = Path(path)
              lines = file.read_text().splitlines()
              for index, line in enumerate(lines):
                  if needle in line:
                      if addition.strip() not in ''.join(lines):
                          lines.insert(index + 1, addition)
                      file.write_text('\n'.join(lines) + '\n')
                      return
              raise RuntimeError(f'{needle} não encontrado em {path}')

          if Path('android/settings.gradle.kts').exists():
              insert_after('android/settings.gradle.kts', 'com.android.application', '    id("com.google.gms.google-services") version "4.4.2" apply false')
              insert_after('android/app/build.gradle.kts', 'com.android.application', '    id("com.google.gms.google-services")')
          else:
              insert_after('android/settings.gradle', 'com.android.application', '    id "com.google.gms.google-services" version "4.4.2" apply false')
              insert_after('android/app/build.gradle', 'com.android.application', '    id "com.google.gms.google-services"')
          PY
      - name: Baixar dependências
        script: flutter pub get
      - name: Gerar APK para Android
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
